[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kijiji-bot-mcp"
version = "0.1.0"
description = "FastMCP server for Kijiji scraping with TOON output"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "mishca" }]
dependencies = [
  "fastmcp>=2.13.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.8",
]

[project.scripts]
kijiji-bot-mcp = "kijiji_bot_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: calls real external Kijiji/Nominatim services and is opt-in",
]

[tool.setuptools.packages.find]
where = ["src"]
