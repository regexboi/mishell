[project]
name = "mishell-x"
version = "0.1.0"
description = "Sync X bookmarks into Neon"
requires-python = ">=3.11"
dependencies = [
  "authlib>=1.6.1",
  "httpx>=0.28.1",
  "psycopg[binary]>=3.2.10",
]

[project.scripts]
sync-x-bookmarks = "scripts.sync_x_bookmarks:main"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
