[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mishell-mcp"
version = "0.1.0"
description = "Safe shell FastMCP server with policy controls and local admin UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.14,<3.0",
  "pydantic>=2.8",
  "bashlex>=0.18",
  "toon_format @ git+https://github.com/toon-format/toon-python.git",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[project.scripts]
mishell-mcp = "mishell_mcp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
